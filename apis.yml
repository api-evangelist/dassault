  name: Dassault Systèmes orders API
  description: >-
    This section defines the operations related to orders, including the creation, management, and fulfillment
    of orders.


    It provides a comprehensive overview of the order lifecycle, from initial request to final delivery.


    The operations in this section are designed to support the efficient and effective management of orders,
    ensuring that customers receive their products or services in a timely and satisfactory manner.


    The following operations are included in this section:


    * Searching Orders

    * Getting Order Details
